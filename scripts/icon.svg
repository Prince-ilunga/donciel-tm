<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fond dégradé saphir, coins arrondis (rx="0" pour la variante maskable) -->
  <rect id="bg" x="0" y="0" width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#glowGrad)"/>

  <!-- Lettre « D » stylée serif blanche + accent saphir -->
  <g id="art">
    <text
      x="256" y="364"
      text-anchor="middle"
      font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif"
      font-size="300"
      font-weight="700"
      fill="#ffffff">D</text>
    <circle cx="374" cy="356" r="24" fill="#38bdf8"/>
  </g>
</svg>
